# Ablation 2b (#7): A1b's setup (informed prompt), trained on a mix of capacities (100 and 300; see train_mixed_cap
# in instances/v0.yaml). One change from abl_informed_rules, which is its comparison row (claims, #15).
# Question: does A1b's capacity collapse (cap500, cap200, scale25) come from training on a single capacity?
base: configs/abl_informed_rules.yaml
experiment: abl_mixed_capacities
evaluation: { train_set: train_mixed_cap }
methods:
  - { name: eoh, params: { pop_size: 10 } }
  # Penalty range widened from 1..100 so the tuner can place the fresh-bin bet at capacity 300 too (an empty bin
  # leaves ~260 there); lo/hi measure gaps in item units and items are unchanged, so they stay. Logged in docs/log.md.
  - { name: tuned_bf, params: { space: { penalty: [1, 300] } } }
