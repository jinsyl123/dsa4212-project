# G1 pilot: EoH (baseline) with a real LLM on the v0 instances.
# Before running: export DEEPSEEK_API_KEY=...  (or switch to OpenAI below)
experiment: eoh_baseline

instances: { spec: configs/instances/v0.yaml, dir: data/v0 }

llm: gemini-3.5-flash-lite

budget: full

parallel: { num_samplers: 2, num_evaluators: 2 }

evaluation:
  { mode: funsearch, timeout_seconds: 60, train_set: train, prompt: llm4ad }

seeds: [0, 1, 2, 3, 4, 5]

methods:
  - { name: eoh, params: { pop_size: 10 } }
  - { name: tuned_bf } # no LLM: Best Fit's 3 knobs tuned by random search, same max_evals as eoh

final_eval:
  sets:
    [
      val,
      test_id_5k,
      test_size_1k,
      test_size_10k,
      test_cap200,
      test_cap500,
      test_cap500_scaled,
      test_scale25,
      test_scale65,
      test_shape_k1.5,
      test_shape_k5,
      test_uniform,
      test_control,
    ]
  timeout_seconds: 900
